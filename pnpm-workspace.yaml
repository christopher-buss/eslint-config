catalogMode: prefer
cleanupUnusedCatalogs: true
enableGlobalVirtualStore: true
ignoreWorkspaceRootCheck: true

minimumReleaseAgeExclude:
  - "@es-joy/escodegen@5.0.1"
  - "@eslint/plugin-kit@0.7.3"
  - "@isentinel/machine-budget@0.2.0"
  - "@oxlint/*"
  - "@tsrs/*"
  - eslint-plugin-flawless
  - eslint-plugin-jsdoc@65.4.6
  - oxlint
  - oxlint-plugin-eslint
  - tsrs

minimumReleaseAgeExcludePrune: true
savePrefix: ""
shellEmulator: true
strictPeerDependencies: false
trustPolicy: no-downgrade

trustPolicyExclude:
  - tsrs

trustPolicyIgnoreAfter: 10080

packages:
  - pnpm-plugin
  - src/*

overrides:
  "@typescript-eslint/scope-manager": 8.72.2
  "@typescript-eslint/type-utils": 8.72.2
  "@typescript-eslint/types": 8.72.2
  "@typescript-eslint/utils": 8.72.2
  "@typescript-eslint/visitor-keys": 8.72.2
  semver@6: 7.8.6

patchedDependencies:
  eslint-plugin-yml: patches/eslint-plugin-yml.patch

catalogs:
  dev:
    "@antfu/ni": 30.6.0
    "@eslint-react/shared": 5.30.2
    "@eslint/config-inspector": 3.5.0
    "@isentinel/tsconfig": 3.0.0
    "@rbxts/types": 1.0.962
    "@stylistic/eslint-plugin-migrate": 4.4.1
    "@total-typescript/shoehorn": 0.1.2
    "@types/node": 24.1.0
    "@types/picomatch": 4.0.3
    "@types/semver": 7.8.0
    "@types/yargs": 17.0.35
    bumpp: 12.3.0
    eslint-plugin-yml: 3.10.0
    eslint-typegen: 2.3.2
    parse-gitignore-ts: 1.0.0
    picomatch: 4.0.7
    pnpm-workspace-yaml: 1.9.1
    publint: 0.3.25
    tsdown: 0.23.7
    type-fest: 5.10.0
    typescript: 6.0.3
    unplugin-unused: 0.6.0
    vitest: 5.1.0
  peer:
    "@vitest/eslint-plugin": 1.6.28
    eslint: 10.15.0
    eslint-plugin-erasable-syntax-only: 0.7.2
    eslint-plugin-eslint-plugin: 7.5.0
    eslint-plugin-jest: 29.17.0
    eslint-plugin-jest-extended: 3.0.1
    eslint-plugin-n: 18.5.0
    eslint-plugin-project-structure: 3.14.6
    eslint-plugin-react-jsx: 5.30.2
    eslint-plugin-react-naming-convention: 5.30.2
    eslint-plugin-react-x: 5.30.2
    eslint-plugin-testing-library: 7.16.2
    oxlint: 1.94.0
    oxlint-tsgolint: 7.0.2007
    tsrs: 7.1.0-beta.tsrs2
  prod:
    "@antfu/install-pkg": 2.1.0
    "@clack/prompts": 1.9.0
    "@cspell/eslint-plugin": 10.5.0
    "@e18e/eslint-plugin": 0.8.1
    "@eslint-community/eslint-plugin-eslint-comments": 4.8.1
    "@eslint/markdown": 8.0.3
    "@isentinel/dict-rbxts": latest
    "@isentinel/dict-roblox": latest
    "@isentinel/machine-budget": 0.2.0
    "@oxlint/plugins": 1.94.0
    "@pobammer-ts/small-rules": 3.12.0
    "@stylistic/eslint-plugin": 6.0.0
    "@typescript-eslint/eslint-plugin": 8.72.2
    "@typescript-eslint/parser": 8.72.2
    ansis: 4.5.0
    concurrently: 10.0.7
    eslint-config-flat-gitignore: 2.4.0
    eslint-config-prettier: 10.1.8
    eslint-flat-config-utils: 3.2.0
    eslint-merge-processors: 2.0.0
    eslint-plugin-antfu: 3.3.1
    eslint-plugin-better-max-params: 1.0.0
    eslint-plugin-comment-length: 2.3.1
    eslint-plugin-de-morgan: 2.3.0
    eslint-plugin-flawless: 1.18.0
    eslint-plugin-format-lua: 2.0.0
    eslint-plugin-import-lite: 0.6.0
    eslint-plugin-jsdoc: 65.4.6
    eslint-plugin-jsonc: 3.4.2
    eslint-plugin-oxfmt: 0.33.0
    eslint-plugin-package-json: 1.14.0
    eslint-plugin-perfectionist: 5.13.0
    eslint-plugin-pnpm: 1.9.1
    eslint-plugin-promise: 7.3.0
    eslint-plugin-roblox-ts: 1.4.1
    eslint-plugin-sentinel: 0.1.2
    eslint-plugin-sonarjs: 4.2.2
    eslint-plugin-toml: 1.5.0
    eslint-plugin-unicorn: 79.0.0
    eslint-plugin-unused-imports: 4.4.1
    file-entry-cache: 11.1.5
    find-up-simple: 1.0.1
    globals: 17.14.0
    jiti: 2.7.0
    jsonc-eslint-parser: 3.3.0
    oxfmt: 0.78.0
    oxlint-plugin-eslint: 1.94.0
    oxlint-plugin-oxlint-comments: 0.1.0
    prettier: 3.10.1
    semver: 7.8.6
    toml-eslint-parser: 1.0.3
    yaml-eslint-parser: 2.1.0
    yargs: 18.2.0

allowBuilds:
  esbuild: true
  # Its binaries come prebuilt in per-platform packages; no install step needed.
  koffi: false

packageExtensions:
  "@e18e/eslint-plugin":
    dependencies:
      "@eslint/core": ^1
      "@types/estree": ^1
    peerDependencies:
      "@typescript-eslint/typescript-estree": "*"
      "@typescript-eslint/utils": "*"
      typescript: "*"
    peerDependenciesMeta:
      "@typescript-eslint/typescript-estree":
        optional: true
      "@typescript-eslint/utils":
        optional: true
      typescript:
        optional: true
  "@es-joy/estraverse":
    dependencies:
      "@types/estree": ^1
      acorn: ^8
  "@es-joy/jsdoccomment":
    peerDependencies:
      eslint: "*"
    peerDependenciesMeta:
      eslint:
        optional: true
  "@eslint-community/eslint-utils":
    dependencies:
      "@types/estree": ^1
  "@eslint/markdown":
    dependencies:
      "@types/mdast": ^4
      "@types/unist": ^3
  "@typescript-eslint/types":
    peerDependencies:
      typescript: "*"
    peerDependenciesMeta:
      typescript:
        optional: true
  eslint-flat-config-utils:
    peerDependencies:
      eslint: "*"
    peerDependenciesMeta:
      eslint:
        optional: true
  eslint-plugin-jsdoc:
    dependencies:
      "@eslint/core": ^1
      "@types/estree": ^1
      "@types/json-schema": ^7
      jsdoc-type-pratt-parser: ^9
    peerDependencies:
      "@typescript-eslint/types": "*"
    peerDependenciesMeta:
      "@typescript-eslint/types":
        optional: true
  eslint-plugin-jsonc:
    dependencies:
      "@types/estree": ^1
  eslint-plugin-n:
    dependencies:
      "@eslint/core": ^1
      "@types/estree": ^1
  eslint-plugin-sentinel:
    peerDependencies:
      "@typescript-eslint/utils": "*"
    peerDependenciesMeta:
      "@typescript-eslint/utils":
        optional: true
  eslint-plugin-sonarjs:
    dependencies:
      "@eslint/core": ^1
      "@types/estree": ^1
      "@types/estree-jsx": ^1
      "@types/functional-red-black-tree": ^1
      "@types/semver": ^7
      type-fest: ^5
    peerDependencies:
      "@typescript-eslint/utils": "*"
    peerDependenciesMeta:
      "@typescript-eslint/utils":
        optional: true
  fdir:
    dependencies:
      "@types/picomatch": ^4
  generate-differences:
    dependencies:
      diff-match-patch-es: ^1
  jsonc-eslint-parser:
    dependencies:
      "@types/estree": ^1
    peerDependencies:
      eslint: "*"
    peerDependenciesMeta:
      eslint:
        optional: true
  mdast-util-gfm-autolink-literal:
    dependencies:
      mdast-util-from-markdown: ^2
      mdast-util-to-markdown: ^2
  pkg-types:
    peerDependencies:
      typescript: "*"
    peerDependenciesMeta:
      typescript:
        optional: true
  toml-eslint-parser:
    peerDependencies:
      eslint: "*"
    peerDependenciesMeta:
      eslint:
        optional: true
  yaml-eslint-parser:
    peerDependencies:
      eslint: "*"
    peerDependenciesMeta:
      eslint:
        optional: true

peerDependencyRules:
  allowedVersions:
    eslint-plugin-jest-extended>eslint: "10"
