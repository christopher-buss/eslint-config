name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node and pnpm at the versions pinned in mise.lock. hk and pkl are only
      # needed for the local pre-commit hook.
      - name: Install node and pnpm
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node pnpm

      - name: Setup
        run: npm i -g @antfu/ni

      - name: Install
        run: nci

      - name: Build
        run: nr build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node and pnpm at the versions pinned in mise.lock. hk and pkl are only
      # needed for the local pre-commit hook.
      - name: Install node and pnpm
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node pnpm

      - name: Setup
        run: npm i -g @antfu/ni

      - name: Install
        run: nci

      - name: Cache ESLint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: >-
            eslint-cache-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml',
            'eslint.config.*', '.eslintignore') }}-${{ github.run_id }}
          path: .eslintcache*
          restore-keys: >
            eslint-cache-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml',
            'eslint.config.*', '.eslintignore') }}-

            eslint-cache-${{ runner.os }}-

      # Before the build: `nr build` runs `nr gen`, which rewrites the
      # `packageExtensions` block, so a table committed without regenerating
      # would be repaired in place and the drift never reported.
      - name: Check package extensions
        run: nr check:extensions

      # Same reason: a snapshot committed without regenerating would be
      # repaired by `nr gen` and the drift never reported. A missed type-aware
      # rule is sorted into the pass that has no TypeScript program.
      - name: Check type-aware snapshot
        run: nr check:type-aware

      # Same reason again. A stale word list silently narrows what
      # `naming: { allowedWords: true }` lets through.
      - name: Check Roblox allowed-words snapshot
        run: nr check:roblox-words

      - name: Build
        run: nr build

      - name: Lint
        run: nr lint

      - name: Validate oxlint config
        run: nr validate:oxlint

      # After the build: reads the emitted declarations.
      - name: Check published extensions
        run: nr check:published

      - name: Typecheck
        run: nr typecheck

  # Too slow for the pre-commit hook: runs ESLint and oxfmt over many scratch
  # projects in both formatter modes. Its own sharded job, so it runs beside
  # `test`.
  parity:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node and pnpm at the versions pinned in mise.lock. hk and pkl are only
      # needed for the local pre-commit hook.
      - name: Install node and pnpm
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node pnpm

      - name: Setup
        run: npm i -g @antfu/ni

      - name: Install
        run: nci

      - name: Formatter parity
        run: nr test:parity
        env:
          PARITY_SHARD: ${{ matrix.shard }}/2

    strategy:
      matrix:
        shard: [1, 2]
      fail-fast: false

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node and pnpm at the versions pinned in mise.lock. hk and pkl are only
      # needed for the local pre-commit hook.
      - name: Install node and pnpm
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node pnpm

      - name: Setup
        run: npm i -g @antfu/ni

      - name: Install
        run: nci

      - name: Test
        run: nr test
